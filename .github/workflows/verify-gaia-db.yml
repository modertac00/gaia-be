name: '01B · DB / Verify Gaia roles via private ECS task'
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type VERIFY_GAIA_DB; never creates databases or roles'
        required: true
permissions:
  contents: read
concurrency:
  group: gaia-production-release
  cancel-in-progress: false
jobs:
  verify:
    if: inputs.confirmation == 'VERIFY_GAIA_DB'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund && npm run build && npm run build:deploy
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image }}:db-verify-${{ github.sha }}
          provenance: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Private ECS DB checks
        env:
          IMAGE_REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          GHCR_SECRET_ARN: ${{ vars.GHCR_SECRET_ARN }}
        run: |
          python3 deploy/preflight.py
          SCHEMA_ACTION=verify-app python3 deploy/schema_task.py
          SCHEMA_ACTION=verify-migrator python3 deploy/schema_task.py
